name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET (pinned by global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Show dotnet version
        run: dotnet --info

      - name: Restore
        run: dotnet restore Total.Recall.sln

      - name: Build (warnings as errors via TreatWarningsAsErrors handled per-project; this job fails the build on any warning)
        run: dotnet build Total.Recall.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test Total.Recall.sln
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --logger "GitHubActions;report-warnings=true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          trx_files=$(find . -name 'test-results.trx' -type f 2>/dev/null || true)
          if [ -z "$trx_files" ]; then
            echo "_No TRX files produced._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Test results (${{ matrix.os }})"
            echo ""
            echo "| Total | Passed | Failed | Skipped |"
            echo "|------:|-------:|-------:|--------:|"
          } >> "$GITHUB_STEP_SUMMARY"
          for trx in $trx_files; do
            total=$(grep -oE 'total="[0-9]+"'    "$trx" | head -1 | grep -oE '[0-9]+' || echo 0)
            passed=$(grep -oE 'passed="[0-9]+"'  "$trx" | head -1 | grep -oE '[0-9]+' || echo 0)
            failed=$(grep -oE 'failed="[0-9]+"'  "$trx" | head -1 | grep -oE '[0-9]+' || echo 0)
            skipped=$(grep -oE 'notExecuted="[0-9]+"' "$trx" | head -1 | grep -oE '[0-9]+' || echo 0)
            echo "| $total | $passed | $failed | $skipped |" >> "$GITHUB_STEP_SUMMARY"
          done

  python-scanner:
    name: python-scanner (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: src/Total.Recall.Scanners.Python
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Test (pytest)
        run: python -m pytest -v

  typescript-scanner:
    name: typescript-scanner (${{ matrix.os }}, node${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['18', '20', '22']
    defaults:
      run:
        working-directory: src/Total.Recall.Scanners.TypeScript
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: src/Total.Recall.Scanners.TypeScript/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Test (vitest)
        run: npm test
